<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo Bleach</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #ff6a00; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: linear-gradient(to top, #3b1d5e, #1a1040 45%, #050510);
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }
    .box {
      background: rgba(8, 8, 18, 0.85);
      border-left: 8px solid var(--accent);
      max-width: 560px;
      width: 100%;
      padding: 28px 24px;
    }
    h1 {
      font-family: 'Anton', Impact, sans-serif;
      font-size: 36px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    h1 span { color: var(--accent); }
    .sub { font-size: 13px; letter-spacing: 2px; opacity: 0.7; margin: 4px 0 18px; }
    .progres { height: 10px; background: rgba(255,255,255,0.15); margin-bottom: 6px; }
    .progres i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.4s; }
    .status { font-size: 13px; letter-spacing: 1px; margin-bottom: 18px; }
    .tambah { display: flex; gap: 8px; margin-bottom: 18px; }
    input {
      flex: 1;
      font-family: inherit;
      font-size: 16px;
      padding: 12px;
      background: rgba(255,255,255,0.08);
      border: 2px solid #f5f5f5;
      color: #fff;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      font-family: 'Anton', Impact, sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0 20px;
      cursor: pointer;
    }
    .btn:hover { background: #fff; }
    ul { list-style: none; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.07);
      border-left: 4px solid #f5f5f5;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    li.selesai { border-left-color: #1fa855; opacity: 0.6; }
    li.selesai span { text-decoration: line-through; }
    li span { flex: 1; word-break: break-word; cursor: pointer; }
    li button {
      background: none;
      border: none;
      color: #ff4d4d;
      font-size: 20px;
      cursor: pointer;
    }
    .kosong { text-align: center; opacity: 0.6; padding: 20px 0; }
    .pangkat { margin-top: 16px; font-size: 14px; text-align: center; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Todo <span>Bleach</span></h1>
    <p class="sub">// MISI SHINIGAMI HARI INI</p>

    <div class="progres"><i id="bar"></i></div>
    <p class="status" id="status"></p>

    <div class="tambah">
      <input id="input" placeholder="Tulis misi barumu..." maxlength="80">
      <button class="btn" id="tambah">Tambah</button>
    </div>

    <ul id="daftar"></ul>
    <p class="pangkat" id="pangkat"></p>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let tugas = [];

    // Ambil data tersimpan (kalau ada)
    try {
      tugas = JSON.parse(localStorage.getItem("todoBleach")) || [];
    } catch (e) {
      tugas = [];
    }

    function simpan() {
      try { localStorage.setItem("todoBleach", JSON.stringify(tugas)); } catch (e) {}
    }

    function render() {
      const ul = $("daftar");
      ul.innerHTML = "";

      if (tugas.length === 0) {
        ul.innerHTML = '<p class="kosong">Belum ada misi. Tambahkan yang pertama!</p>';
      }

      tugas.forEach((t, idx) => {
        const li = document.createElement("li");
        if (t.selesai) li.className = "selesai";

        const teks = document.createElement("span");
        teks.textContent = t.teks;
        teks.onclick = () => { tugas[idx].selesai = !tugas[idx].selesai; simpan(); render(); };

        const hapus = document.createElement("button");
        hapus.textContent = "✕";
        hapus.onclick = () => { tugas.splice(idx, 1); simpan(); render(); };

        li.appendChild(teks);
        li.appendChild(hapus);
        ul.appendChild(li);
      });

      const total = tugas.length;
      const done = tugas.filter(t => t.selesai).length;
      const persen = total ? Math.round(done / total * 100) : 0;
      $("bar").style.width = persen + "%";
      $("status").textContent = done + " / " + total + " MISI SELESAI (" + persen + "%)";

      let p = "";
      if (total > 0 && done === total) p = "⚔️ Semua misi selesai! Bankai!";
      else if (persen >= 50) p = "Level Kapten. Terus semangat!";
      else if (total > 0) p = "Level Murid Akademi. Ayo mulai!";
      $("pangkat").textContent = p;
    }

    function tambah() {
      const v = $("input").value.trim();
      if (!v) return;
      tugas.push({ teks: v, selesai: false });
      $("input").value = "";
      simpan();
      render();
    }

    $("tambah").onclick = tambah;
    $("input").addEventListener("keydown", e => { if (e.key === "Enter") tambah(); });

    render();
  </script>
</body>
</html>
