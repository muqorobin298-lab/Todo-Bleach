<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo Bleach</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #ff6a00; --spark: #ffcf8a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: #050510;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    /* ===== LATAR ANIME ===== */
    #scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .layer { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
    .layer.aktif { opacity: 1; }
    .kanji {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 45vw; font-weight: 900;
      color: #fff; opacity: 0.06; white-space: nowrap;
    }
    .orb {
      position: absolute; top: 9%; right: 10%;
      width: clamp(120px, 22vw, 260px);
      aspect-ratio: 1; border-radius: 50%;
    }
    .city { position: absolute; bottom: 0; left: 0; width: 100%; height: 36vh; }
    #sparks { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .spark {
      position: absolute; bottom: -10px; border-radius: 50%;
      background: var(--spark); box-shadow: 0 0 8px var(--spark);
      opacity: 0; animation: naik linear infinite;
      transition: background 1s, box-shadow 1s;
    }
    @keyframes naik {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      10%  { opacity: 0.9; }
      100% { transform: translateY(-105vh) translateX(40px); opacity: 0; }
    }

    /* ===== KOTAK TODO ===== */
    .box {
      position: relative; z-index: 1;
      background: rgba(8, 8, 18, 0.82);
      backdrop-filter: blur(4px);
      border-left: 8px solid var(--accent);
      max-width: 560px; width: 100%;
      padding: 28px 24px;
      transition: border-color 1s;
    }
    h1 {
      font-family: 'Anton', Impact, sans-serif;
      font-size: 36px; letter-spacing: 3px; text-transform: uppercase;
    }
    h1 span { color: var(--accent); transition: color 1s; }
    .sub { font-size: 13px; letter-spacing: 2px; opacity: 0.75; margin: 4px 0 4px; }
    .lokasi {
      font-family: 'Anton', Impact, sans-serif;
      letter-spacing: 3px; font-size: 14px; color: var(--accent);
      margin-bottom: 16px; text-transform: uppercase; transition: color 1s;
    }
    .progres { height: 10px; background: rgba(255,255,255,0.15); margin-bottom: 6px; }
    .progres i {
      display: block; height: 100%; width: 0;
      background: var(--accent); box-shadow: 0 0 10px var(--accent);
      transition: width 0.4s, background 1s;
    }
    .status { font-size: 13px; letter-spacing: 1px; margin-bottom: 18px; }
    .tambah { display: flex; gap: 8px; margin-bottom: 18px; }
    input {
      flex: 1; font-family: inherit; font-size: 16px; padding: 12px;
      background: rgba(255,255,255,0.08);
      border: 2px solid #f5f5f5; color: #fff; outline: none;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      font-family: 'Anton', Impact, sans-serif;
      font-size: 16px; letter-spacing: 2px; text-transform: uppercase;
      background: var(--accent); color: #000;
      border: none; padding: 0 20px; cursor: pointer;
      transition: background 1s;
    }
    .btn:hover { background: #fff; }
    ul { list-style: none; }
    li {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.07);
      border-left: 4px solid #f5f5f5;
      padding: 12px 14px; margin-bottom: 10px;
    }
    li.selesai { border-left-color: #1fa855; opacity: 0.6; }
    li.selesai span { text-decoration: line-through; }
    li span { flex: 1; word-break: break-word; cursor: pointer; }
    li button { background: none; border: none; color: #ff4d4d; font-size: 20px; cursor: pointer; }
    .kosong { text-align: center; opacity: 0.6; padding: 20px 0; }
    .pangkat { margin-top: 16px; font-size: 14px; text-align: center; letter-spacing: 1px; }

    /* Tulisan BANKAI */
    #bankai {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      font-family: 'Anton', Impact, sans-serif;
      font-size: clamp(60px, 16vw, 160px);
      letter-spacing: 6px; color: #ffd400;
      text-shadow: 0 0 30px #ff3d00, 0 0 70px #ff3d00;
      z-index: 5; opacity: 0; pointer-events: none;
    }
    #bankai.muncul { animation: bankai 2s ease forwards; }
    @keyframes bankai {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      70%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
    }
  </style>
</head>
<body>

  <div id="scene"></div>
  <div id="sparks"></div>
  <div id="bankai">BANKAI!</div>

  <div class="box">
    <h1>Todo <span>Bleach</span></h1>
    <p class="sub">// MISI SHINIGAMI HARI INI</p>
    <p class="lokasi" id="lokasi"></p>

    <div class="progres"><i id="bar"></i></div>
    <p class="status" id="status"></p>

    <div class="tambah">
      <input id="input" placeholder="Tulis misi barumu..." maxlength="80">
      <button class="btn" id="tambah">Tambah</button>
    </div>

    <ul id="daftar"></ul>
    <p class="pangkat" id="pangkat"></p>
  </div>

  <script>
    // ===== TEMA LATAR (berubah sesuai progres) =====
    const tema = [
      { nama: "Senja Karakura", kanji: "代行", g: "linear-gradient(to top,#ff7b3d,#c2410c 40%,#3b1d5e 100%)", orb: "radial-gradient(circle,#fff3c4 0%,#ffd27a 60%,#ff9a3c 100%)", glow: "#ffb347", city: "#1a0a12", accent: "#ff6a00", spark: "#ffcf8a" },
      { nama: "Malam Bersalju", kanji: "月", g: "linear-gradient(to top,#2a4a7a,#10234a 50%,#030818 100%)", orb: "radial-gradient(circle,#ffffff 0%,#dbeafe 70%,#a5c8ff 100%)", glow: "#bcd8ff", city: "#050b1a", accent: "#4da6ff", spark: "#d6e8ff" },
      { nama: "Hujan Sakura", kanji: "桜", g: "linear-gradient(to top,#ff9ec4,#a8326b 45%,#2a0b2e 100%)", orb: "radial-gradient(circle,#fff0f6 0%,#ffc2da 70%,#ff8fba 100%)", glow: "#ffb3d1", city: "#1f0720", accent: "#ff5c9e", spark: "#ffd0e3" },
      { nama: "Istana Es", kanji: "氷", g: "linear-gradient(to top,#b8ecff,#2a8fc7 45%,#062a4d 100%)", orb: "radial-gradient(circle,#ffffff 0%,#e0f7ff 70%,#9fe3ff 100%)", glow: "#aeeaff", city: "#04182e", accent: "#38d4ff", spark: "#ffffff" },
      { nama: "BANKAI!", kanji: "卍解", g: "linear-gradient(to top,#ff7b3d,#7a0b1b 45%,#2b0008 100%)", orb: "radial-gradient(circle,#fffbe0 0%,#ffe9b0 60%,#ffd400 100%)", glow: "#ffd400", city: "#1a0004", accent: "#ffd400", spark: "#ffe28a" }
    ];

    const kota = `<svg class="city" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice" fill="CITYCOLOR">
      <rect x="0" y="270" width="1200" height="30"/>
      <path d="M90 270 V190 H130 V270 Z"/><path d="M70 195 Q110 185 150 195 L135 170 H85 Z"/><path d="M85 170 Q110 160 135 170 L125 150 H95 Z"/><path d="M95 150 L110 125 L125 150 Z"/>
      <path d="M200 270 V215 H420 V270 Z"/><path d="M180 220 Q310 195 440 220 L410 200 H210 Z"/>
      <path d="M520 270 V160 H580 V270 Z"/><path d="M495 165 Q550 150 605 165 L585 135 H515 Z"/><path d="M512 135 Q550 120 588 135 L575 108 H525 Z"/><path d="M525 108 Q550 95 575 108 L562 82 H538 Z"/><path d="M540 82 L550 50 L560 82 Z"/>
      <path d="M680 270 V220 H860 V270 Z"/><path d="M660 225 Q770 200 880 225 L850 205 H690 Z"/>
      <path d="M930 270 V185 H980 V270 Z"/><path d="M910 190 Q955 178 1000 190 L985 165 H925 Z"/><path d="M925 165 Q955 152 985 165 L975 140 H935 Z"/><path d="M938 140 L955 112 L972 140 Z"/>
      <path d="M1060 270 V225 H1200 V270 Z"/><path d="M1045 230 Q1130 208 1215 230 L1190 212 H1070 Z"/>
    </svg>`;

    const scene = document.getElementById("scene");
    const layers = tema.map(t => {
      const d = document.createElement("div");
      d.className = "layer";
      d.style.background = t.g;
      d.innerHTML =
        '<div class="kanji">' + t.kanji + '</div>' +
        '<div class="orb" style="background:' + t.orb + ';box-shadow:0 0 40px ' + t.glow + ',0 0 110px ' + t.glow + '"></div>' +
        kota.replace("CITYCOLOR", t.city);
      scene.appendChild(d);
      return d;
    });

    const sparks = document.getElementById("sparks");
    for (let n = 0; n < 35; n++) {
      const s = document.createElement("div");
      s.className = "spark";
      const size = 2 + Math.random() * 4;
      s.style.width = s.style.height = size + "px";
      s.style.left = Math.random() * 100 + "%";
      s.style.animationDuration = (6 + Math.random() * 8) + "s";
      s.style.animationDelay = (Math.random() * 10) + "s";
      sparks.appendChild(s);
    }

    let temaSekarang = -1;
    function gantiTema(idx) {
      if (idx === temaSekarang) return;
      const naikKeBankai = idx === 4 && temaSekarang !== -1;
      temaSekarang = idx;
      const t = tema[idx];
      layers.forEach((l, n) => l.classList.toggle("aktif", n === idx));
      document.documentElement.style.setProperty("--accent", t.accent);
      document.documentElement.style.setProperty("--spark", t.spark);
      document.getElementById("lokasi").textContent = "// " + t.nama;
      if (naikKeBankai) {
        const b = document.getElementById("bankai");
        b.classList.remove("muncul");
        void b.offsetWidth;
        b.classList.add("muncul");
      }
    }

    // ===== LOGIKA TODO =====
    const $ = id => document.getElementById(id);
    let tugas = [];

    try {
      tugas = JSON.parse(localStorage.getItem("todoBleach")) || [];
    } catch (e) {
      tugas = [];
    }

    function simpan() {
      try { localStorage.setItem("todoBleach", JSON.stringify(tugas)); } catch (e) {}
    }

    function render() {
      const ul = $("daftar");
      ul.innerHTML = "";

      if (tugas.length === 0) {
        ul.innerHTML = '<p class="kosong">Belum ada misi. Tambahkan yang pertama!</p>';
      }

      tugas.forEach((t, idx) => {
        const li = document.createElement("li");
        if (t.selesai) li.className = "selesai";

        const teks = document.createElement("span");
        teks.textContent = t.teks;
        teks.onclick = () => { tugas[idx].selesai = !tugas[idx].selesai; simpan(); render(); };

        const hapus = document.createElement("button");
        hapus.textContent = "✕";
        hapus.onclick = () => { tugas.splice(idx, 1); simpan(); render(); };

        li.appendChild(teks);
        li.appendChild(hapus);
        ul.appendChild(li);
      });

      const total = tugas.length;
      const done = tugas.filter(t => t.selesai).length;
      const persen = total ? Math.round(done / total * 100) : 0;
      $("bar").style.width = persen + "%";
      $("status").textContent = done + " / " + total + " MISI SELESAI (" + persen + "%)";

      let p = "";
      if (total > 0 && done === total) p = "⚔️ Semua misi selesai! Bankai!";
      else if (persen >= 50) p = "Level Kapten. Terus semangat!";
      else if (total > 0) p = "Level Murid Akademi. Ayo mulai!";
      $("pangkat").textContent = p;

      // Tema mengikuti progres
      let idxTema = 0;
      if (total > 0 && done === total) idxTema = 4;
      else if (persen >= 75) idxTema = 3;
      else if (persen >= 50) idxTema = 2;
      else if (persen >= 25) idxTema = 1;
      gantiTema(idxTema);
    }

    function tambah() {
      const v = $("input").value.trim();
      if (!v) return;
      tugas.push({ teks: v, selesai: false });
      $("input").value = "";
      simpan();
      render();
    }

    $("tambah").onclick = tambah;
    $("input").addEventListener("keydown", e => { if (e.key === "Enter") tambah(); });

    render();
  </script>
</body>
</html>
